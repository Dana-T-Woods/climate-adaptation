<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livermore heat, transit and amenities (Map4-4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* Cards and popups follow the viewer's light or dark setting; the map chrome (search, drawer, legend) is always dark glass */
  :root {
    --card: #ffffff; --ink: #1b1f23; --muted: #5f6b73; --line: #e3e6e8; --soft: #f2f4f5;
    --accent: #e2531a; --accent-ink: #ffffff;
    --warn: #b3261e; --warn-bg: #fdecea; --sample: #7a5200; --sample-bg: #fdf0d0;
    --good: #15703b; --ok: #8a6d00; --poor: #b3261e; --chart: #3b73c7;
    --cta: #ff5a1f; --cta-ink: #ffffff; --alert: #f2557a;
    --shadow: 0 2px 6px rgba(0,0,0,.2), 0 12px 30px rgba(0,0,0,.22);
    --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --dw: 336px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --card: #1e2226; --ink: #eef1f3; --muted: #a3acb3; --line: #30363b; --soft: #272c31;
      --accent: #ff7a45; --accent-ink: #1b0f08; --warn: #ff8a7a; --warn-bg: #3b1d19;
      --sample: #f2c76b; --sample-bg: #3a2e12; --good: #5fcf8b; --ok: #e3c14a; --poor: #ff8a7a; --chart: #6c9be6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --card: #1e2226; --ink: #eef1f3; --muted: #a3acb3; --line: #30363b; --soft: #272c31;
    --accent: #ff7a45; --accent-ink: #1b0f08; --warn: #ff8a7a; --warn-bg: #3b1d19;
    --sample: #f2c76b; --sample-bg: #3a2e12; --good: #5fcf8b; --ok: #e3c14a; --poor: #ff8a7a; --chart: #6c9be6;
    color-scheme: dark;
  }
  .glass {
    --card: rgba(17,19,21,.9); --ink: #f1f3f4; --muted: #a8afb5; --line: rgba(255,255,255,.13); --soft: rgba(255,255,255,.07);
    --accent: #ff7a45; --accent-ink: #1b0f08; --warn: #ff8a7a; --warn-bg: rgba(255,120,100,.12);
    --sample: #f2c76b; --sample-bg: rgba(242,199,107,.14); --good: #5fcf8b; --ok: #e3c14a; --poor: #ff8a7a;
    background: var(--card); color: var(--ink); color-scheme: dark;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; background: #111; color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.45; }
  #map { position: absolute; inset: 0; background: #1a1d1f; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--cta); outline-offset: 2px; }
  .float { position: absolute; z-index: 1000; border-radius: 10px; box-shadow: var(--shadow); }

  /* ---------- Top right: search, area card, draw button ---------- */
  .topright { position: absolute; z-index: 1001; top: 12px; right: 12px; width: 300px; display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
  .search { position: relative; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; box-shadow: var(--shadow); }
  .search svg { flex: none; opacity: .8; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 13px; color: var(--ink); }
  .search input::placeholder { color: var(--muted); }
  .search-results { --card: rgba(17,19,21,.98); position: absolute; top: 42px; left: 0; right: 0; margin: 0; padding: 4px; list-style: none; border-radius: 12px; box-shadow: var(--shadow); max-height: 320px; overflow-y: auto; }
  .search-results[hidden] { display: none; }
  .search-results li { padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .search-results li[aria-selected="true"], .search-results li:hover { background: var(--soft); }
  .search-results .sr-name { font-weight: 600; }
  .search-results .sr-sub { font-size: 11.5px; color: var(--muted); }
  .search-results .sr-empty { color: var(--muted); cursor: default; }

  .areacard { background: var(--card); color: var(--ink); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
  .ac-head { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 9px 12px 0; cursor: pointer; text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; }
  .ac-head .chev { margin-left: auto; transition: transform .15s; }
  .areacard.collapsed .chev { transform: rotate(-90deg); }
  .areacard.collapsed .ac-body { display: none; }
  .areacard.collapsed .ac-head { padding-bottom: 9px; }
  .ac-body { padding: 0 12px 10px; }
  .ac-acres { font-size: 11px; font-weight: 700; margin-top: 2px; }
  .ac-big { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
  .ac-chart-title { margin-top: 10px; font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ac-chart svg { display: block; width: 100%; height: auto; }
  .ac-stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; }
  .ac-stats dt { color: var(--muted); }
  .ac-stats dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ac-foot { margin-top: 8px; font-size: 11.5px; color: var(--muted); }

  .cta { align-self: center; display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 6px; padding: 8px 18px; background: var(--cta); color: var(--cta-ink); font-weight: 700; font-size: 12.5px; cursor: pointer; box-shadow: 0 2px 10px rgba(255,90,31,.45); }
  .cta:hover { filter: brightness(1.06); }
  .cta[disabled] { opacity: .6; cursor: default; }
  .cta .chevs { letter-spacing: -2px; opacity: .85; }
  .cta-row { display: flex; justify-content: center; gap: 8px; }
  .cta-cancel { border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 600; font-size: 12.5px; cursor: pointer; box-shadow: var(--shadow); }
  .cta-cancel[hidden] { display: none; }

  .toast { left: 50%; top: 14px; transform: translateX(-50%); padding: 8px 14px; font-size: 12.5px; max-width: min(460px, calc(100vw - 360px)); text-align: center; }
  .toast[hidden] { display: none; }

  /* ---------- Left: layers button and drawer ---------- */
  .layers-btn { top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: 0; border-radius: 19px; font-weight: 600; cursor: pointer; }
  .drawer { top: 58px; left: 12px; bottom: 12px; width: var(--dw); display: none; flex-direction: column; overflow: hidden; border-radius: 12px; }
  body.drawer-open .drawer { display: flex; }
  .drawer-head { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); flex: none; }
  .tabs { display: flex; flex: 1; }
  .tabs button { flex: 1; border: 0; background: none; padding: 10px 6px 8px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cta); }
  .drawer-close { border: 0; background: none; padding: 0 14px; color: var(--muted); cursor: pointer; font-size: 18px; border-left: 1px solid var(--line); }
  .drawer-body { overflow-y: auto; padding: 4px 14px 14px; flex: 1; }

  .sec { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .sec:last-child { border-bottom: 0; }
  .sec > h2 { margin: 0 0 2px; font-size: 14px; font-weight: 700; }
  .hint { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  .radio-list { display: flex; flex-direction: column; gap: 2px; }
  .radio-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .radio-row:hover { background: var(--soft); }
  .radio-row.on { background: rgba(255,122,69,.16); }
  .radio-row input, .check input, .layer-head input { accent-color: var(--accent); margin: 0; }
  .radio-row .rl-label { flex: 1; font-weight: 500; }
  .opts { margin: 8px 0 0; padding: 10px; border-radius: 8px; background: var(--soft); }
  .about { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .badge-sample { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 10.5px; font-weight: 600; background: var(--sample-bg); color: var(--sample); border: 1px solid currentColor; line-height: 16px; white-space: nowrap; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--soft); border: 1px solid var(--line); margin-bottom: 8px; }
  .seg button { flex: 1; border: 0; background: none; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .slider { margin: 6px 0 2px; }
  .slider .sl-top { display: flex; justify-content: space-between; font-size: 12px; }
  .slider .sl-top b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .slider input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 7px; cursor: pointer; margin: 3px 0; }
  .check .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }
  .layer { padding: 8px 0; }
  .layer + .layer { border-top: 1px dashed var(--line); }
  .layer-head { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .layer-head .lh-label { flex: 1; }
  .layer-body { margin: 6px 0 0 22px; }
  .layer.off .layer-body { opacity: .5; }
  .sw-img { width: 18px; height: 18px; }
  .rid-sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #111; flex: none; }
  .glass .rid-sw { border-color: #e6e6e6; }
  .rid-sw.t1 { background: rgba(17,17,17,0.6); } .rid-sw.t2 { background: rgba(122,122,122,0.55); } .rid-sw.t3 { background: rgba(255,255,255,0.9); }
  .small { font-size: 11px; color: var(--muted); }
  .btn { display: inline-block; margin-top: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); cursor: pointer; font-size: 12px; font-weight: 500; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 12px; }
  .loader { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .loader .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .status { margin-top: 6px; font-size: 11.5px; }
  .status.err { color: var(--warn); }
  details.help { margin-top: 4px; }
  details.help summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  details.help div { font-size: 12px; color: var(--muted); }
  details.help p { margin: 4px 0; }
  code { font-size: 11.5px; background: var(--soft); padding: 0 3px; border-radius: 3px; }
  #rid-size-legend text { fill: var(--muted); }
  #rid-size-legend circle { stroke: #ddd; }

  /* ---------- Legend and basemap ---------- */
  .legendcard { left: 12px; bottom: 34px; padding: 10px 12px; width: 250px; }
  .legendcard[hidden] { display: none; }
  body.drawer-open .legendcard, body.drawer-open .leaflet-bottom.leaflet-left { left: calc(var(--dw) + 24px); }
  body.drawer-open .leaflet-bottom.leaflet-left { left: calc(var(--dw) + 14px); }
  .legendcard h2 { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .grad { height: 10px; border-radius: 3px; }
  .ticks { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
  .ticks span { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }
  .classes { display: grid; grid-template-columns: 16px 1fr auto; gap: 3px 8px; align-items: center; font-size: 12px; }
  .classes.grains { grid-template-columns: 26px 1fr auto; }
  .classes i { width: 16px; height: 12px; border-radius: 2px; }
  .classes .rng { color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend-note { margin-top: 6px; font-size: 11px; color: var(--muted); }
  .legend-note .dash { display: inline-block; width: 16px; height: 10px; border: 1.5px dashed var(--ink); vertical-align: -1px; margin-right: 4px; }
  .basemap { right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 2px; padding: 3px; }
  .basemap button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 11.5px; }
  .basemap button[aria-pressed="true"] { background: #f1f3f4; color: #111; }

  /* ---------- Leaflet chrome ---------- */
  .leaflet-bar { border: 0 !important; box-shadow: var(--shadow) !important; }
  .leaflet-bar a { background: rgba(17,19,21,.9); color: #f1f3f4; border-bottom-color: rgba(255,255,255,.13); }
  .leaflet-bar a:hover { background: #2a2e31; color: #fff; }
  .leaflet-control-attribution { background: rgba(17,19,21,.6) !important; color: #c9cfd3; font-size: 10px; }
  .leaflet-control-attribution a { color: #e6eaec; }
  .leaflet-control-scale-line { background: rgba(17,19,21,.6); color: #e6eaec; border-color: #e6eaec; }
  .heat-smooth { pointer-events: none; }
  .pollen-icon, .alert-icon { background: none; border: 0; }
  .alert-icon svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); overflow: visible; }
  .drawing { cursor: crosshair !important; }
  .drawing .leaflet-interactive, .drawing .leaflet-marker-icon, .drawing canvas { pointer-events: none !important; }

  /* ---------- Popups (white cards, like the stats card) ---------- */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .leaflet-popup-content { margin: 12px 14px; font-family: var(--font); font-size: 12px; line-height: 1.5; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-tooltip { font-family: var(--font); }
  .pop-title { font-size: 14px; font-weight: 800; margin-bottom: 2px; padding-right: 12px; }
  .pop-sec { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); }
  .pop-head { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 2px; display: flex; gap: 6px; align-items: center; }
  .pop-warn { color: var(--warn); font-weight: 600; }
  .pop-alert { color: var(--alert); font-weight: 700; }
  .q-Good { color: var(--good); font-weight: 650; } .q-Ok { color: var(--ok); font-weight: 650; } .q-Poor { color: var(--poor); font-weight: 650; }
  .pop-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .pop-actions a, .pop-actions button { text-align: center; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .pop-actions a { background: var(--ink); color: var(--card) !important; }
  .pop-actions button { border: 1px solid var(--ink); background: var(--card); }
  .bp-small { font-size: 11px; color: var(--muted); }
  .rid-badge { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 600; border: 1px solid #111; }
  .rid-badge.t1 { background: #111; color: #fff; } .rid-badge.t2 { background: #7a7a7a; border-color: #7a7a7a; color: #fff; } .rid-badge.t3 { background: #fff; color: #111; }

  /* ---------- Time of Day (ported) ---------- */
  .tod-warn { margin: 6px 0; padding: 6px 8px; border-radius: 6px; background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn); font-size: 11.5px; }
  .tod-sel { font-size: 14px; font-weight: 700; margin: 10px 0 2px; }
  .tod-sel .rid-badge { font-size: 10px; vertical-align: 2px; margin-left: 4px; }
  .tod-link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 11.5px; }
  .tod-days { display: flex; gap: 4px; margin: 8px 0; }
  .tod-days button { flex: 1; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); cursor: pointer; font-size: 12px; }
  .tod-days button.active { background: var(--ink); border-color: var(--ink); color: #111; }
  .tod-key { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-size: 11.5px; }
  .tod-key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  #tod-body svg { max-width: 100%; height: auto; }
  .tod-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tod-table th { text-align: right; font-weight: 600; color: var(--muted); padding: 3px; border-bottom: 1px solid var(--line); }
  .tod-table td { text-align: right; padding: 3px; }
  .tod-table th:first-child, .tod-table td:first-child { text-align: left; }
  .tod-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  /* ---------- Phones ---------- */
  @media (max-width: 720px) {
    .topright { left: 10px; right: 10px; width: auto; top: calc(10px + env(safe-area-inset-top, 0px)); }
    .toast { top: auto; bottom: 120px; max-width: calc(100vw - 24px); }
    .layers-btn { top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 10px; }
    body.drawer-open .layers-btn, body.drawer-open .basemap, body.drawer-open .leaflet-bottom.leaflet-right { display: none; }
    .drawer { top: auto; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 62vh; }
    .legendcard { left: 10px; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: auto; max-width: calc(100vw - 110px); padding: 8px 10px; }
    body.drawer-open .legendcard { display: none; }
    body.drawer-open .leaflet-bottom.leaflet-left { left: 0; }
    .leaflet-bottom.leaflet-left { display: none; }
    .basemap { right: 10px; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="pg-grad" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#f6b51e"/><stop offset="1" stop-color="#b8650a"/>
    </radialGradient>
  </defs>
</svg>

<div id="map" role="application" aria-label="Map of Livermore"></div>

<button type="button" class="float glass layers-btn" id="drawer-toggle" aria-expanded="false" aria-controls="drawer">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
  Layers
</button>

<aside class="float glass drawer" id="drawer" aria-label="Layers and time of day">
  <div class="drawer-head">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-btn-layers" aria-selected="true" aria-controls="tab-layers">Layers</button>
      <button type="button" role="tab" id="tab-btn-tod" aria-selected="false" aria-controls="tab-tod">Time of day</button>
    </div>
    <button type="button" class="drawer-close" id="drawer-close" aria-label="Close layers">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body">
    <div id="tab-layers" role="tabpanel"></div>
    <div id="tab-tod" role="tabpanel" hidden>
      <div class="tod-sel" id="tod-sel"></div>
      <div class="tod-days" id="tod-days"></div>
      <div id="tod-body"></div>
      <div class="loader">
        <input type="file" id="tod-file" accept=".csv,text/csv" hidden>
        <button type="button" class="btn" id="tod-load">Load hourly data (CSV)</button>
        <div class="status small" id="tod-status"></div>
      </div>
    </div>
  </div>
</aside>

<div class="topright">
  <div class="search glass" role="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false"
      role="combobox" aria-label="Search stops by name, street or stop number" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
    <ul class="search-results glass" id="search-results" role="listbox" hidden></ul>

  var out = [], cur = '', q = false;
  for (var i = 0; i < line.length; i++) {
    var c = line.charAt(i);
    if (q) { if (c === '"') { if (line.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out;
}
function csvNorm(h) { return String(h).replace(/^\uFEFF/, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function readCsv(text) {
  var lines = text.split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
  var raw = lines.length ? csvSplit(lines[0]) : [];
  return { raw: raw, heads: raw.map(csvNorm), rows: lines.slice(1).map(csvSplit) };
}
function csvCol(heads, names) { for (var i = 0; i < heads.length; i++) if (names.indexOf(heads[i]) >= 0) return i; return -1; }
function downloadText(name, text) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* =====================================================================
   Layer registry
   ---------------------------------------------------------------------
   Every dataset is one entry in LAYERS. Two kinds:
     surface: a grid that covers the area (heat, pollen). One shows at a time.
     points:  features at locations (stops, ridership, lights). Any combination.
   The panel, legend and stop popups are all built from these entries,
   so a new dataset only needs a new entry (see makeSurface / makePoints).
   ===================================================================== */
var LAYERS = [];
function layerById(id) { for (var i = 0; i < LAYERS.length; i++) if (LAYERS[i].id === id) return LAYERS[i]; return null; }
function register(def) { if (def.opacity == null) def.opacity = 1; LAYERS.push(def); return def; }

function makeSurface(def) {
  def.kind = 'surface';
  def.group = L.layerGroup();
  def.cells = [];
  def.build = function () {
    def.group.clearLayers();
    def.cells = def.getCells();
    def.cells.forEach(function (c) {
      c.rect = L.rectangle([[c.s, c.w], [c.n, c.e]], { renderer: surfaceRenderer, pane: 'surfaces', weight: 0.5 });
      c.rect.bindPopup(function () { return def.cellPopup(c); }, { maxWidth: 300, minWidth: 210 });
      def.group.addLayer(c.rect);
    });
    if (def.afterBuild) def.afterBuild();
    def.restyle();
  };
  def.restyle = function () {
    var op = def.opacity;
    def.cells.forEach(function (c) {
      var v = def.value(c), st;
      if (v == null || isNaN(v)) st = { fillOpacity: 0, opacity: 0, weight: 0, dashArray: null };
      else {
        var col = def.color(v);
        st = { fillColor: col, color: col, fillOpacity: op, opacity: op * 0.75, weight: 0.5, dashArray: null };
        var extra = def.cellStyle ? def.cellStyle(c, op) : null;
        if (extra) for (var k in extra) st[k] = extra[k];
      }
      c.rect.setStyle(st);
    });
  };
  def.cellAt = function (lat, lon) {
    for (var i = 0; i < def.cells.length; i++) {
      var c = def.cells[i];
      if (lat >= c.s && lat < c.n && lon >= c.w && lon < c.e) return c;
    }
    return null;
  };
  return register(def);
}

function makePoints(def) {
  def.kind = 'points';
  def.group = L.layerGroup();
  def.markers = [];
  def.counts = {};
  if (def.on == null) def.on = true;
  def.catOn = {};
  def.categories.forEach(function (c) { def.catOn[c.id] = c.defaultOn !== false; });
  def.build = function () {
    def.markers = def.makeMarkers();
    if (def.countMarkers) def.counts = def.countMarkers(def.markers);
    else {
      def.counts = {};
      def.categories.forEach(function (c) { def.counts[c.id] = 0; });
      def.markers.forEach(function (m) { def.counts[m._cat] = (def.counts[m._cat] || 0) + 1; });
    }
    def.refresh();
    if (def.applyOpacity) def.applyOpacity();
  };
  // Markers are re-added in array order, so a layer can control what draws on top.
  def.refresh = def.refresh || function () {
    def.group.clearLayers();
    def.markers.forEach(function (m) { if (def.catOn[m._cat]) def.group.addLayer(m); });
  };
  def.setVisible = function (v) { def.on = v; if (v) def.group.addTo(map); else map.removeLayer(def.group); };
  return register(def);
}

/* =====================================================================
   Layer: urban heat (surface). Two views:
     Hotspots: the 400 m cells blended into a smooth surface, showing only
               areas warmer than a chosen threshold (the mockup's heat blobs).
     Grid:     the exact cells, every value coloured.
   ===================================================================== */
var HEAT_RAMP = [[0, [84, 39, 143]], [0.25, [44, 123, 182]], [0.5, [0, 170, 80]], [0.75, [240, 127, 19]], [1, [140, 10, 20]]];
var HOT_RAMP = [[0, [40, 175, 80]], [0.22, [200, 215, 40]], [0.45, [245, 150, 25]], [0.72, [230, 60, 35]], [1, [180, 10, 35]]];
function rampRgb(stops, t) {
  t = clamp(t, 0, 1);
  for (var i = 0; i < stops.length - 1; i++) {
    var a = stops[i], b = stops[i + 1];
    if (t >= a[0] && t <= b[0]) { var k = (t - a[0]) / (b[0] - a[0]); return [0, 1, 2].map(function (j) { return a[1][j] + (b[1][j] - a[1][j]) * k; }); }
  }
  return stops[stops.length - 1][1];
}
var heatFeatures = DATA.heatGrid.features;
var heatVals = heatFeatures.map(function (f) { return f.properties.avgDeltaF; });
var heatDomain = [Math.floor(Math.min.apply(null, heatVals)), Math.ceil(Math.max.apply(null, heatVals))];
var heatReadings = heatFeatures.reduce(function (a, f) { return a + f.properties.count; }, 0);
var GRID = (function () {
  var r = heatFeatures[0].geometry.coordinates[0];
  var lons = r.map(function (c) { return c[0]; }), lats = r.map(function (c) { return c[1]; });
  var cw = Math.max.apply(null, lons) - Math.min.apply(null, lons), ch = Math.max.apply(null, lats) - Math.min.apply(null, lats);
  var cols = Math.round((BOUNDS[1][1] - BOUNDS[0][1]) / cw), rows = Math.round((BOUNDS[1][0] - BOUNDS[0][0]) / ch);
  return { W: BOUNDS[0][1], S: BOUNDS[0][0], cw: cw, ch: ch, cols: cols, rows: rows, N: BOUNDS[0][0] + rows * ch, E: BOUNDS[0][1] + cols * cw };
})();

// Gaussian-weighted blend of the cells, drawn at 8 pixels per cell; areas without readings fade out.
function heatSmoothUrl(thr) {
  var G = GRID, k = 8, V = new Float32Array(G.cols * G.rows).fill(NaN);
  heat.cells.forEach(function (c) {
    var ci = Math.round((c.w - G.W) / G.cw), ri = Math.round((G.N - c.n) / G.ch);
    if (ci >= 0 && ci < G.cols && ri >= 0 && ri < G.rows) V[ri * G.cols + ci] = c.p.avgDeltaF;
  });
  var Wp = G.cols * k, Hp = G.rows * k, cv = document.createElement('canvas');
  cv.width = Wp; cv.height = Hp;
  var ctx = cv.getContext('2d'), img = ctx.createImageData(Wp, Hp), d = img.data;
  var sig2 = 2 * 0.8 * 0.8, top = heatDomain[1], R = 2;
  for (var py = 0; py < Hp; py++) {
    var y = (py + 0.5) / k - 0.5;
    for (var px = 0; px < Wp; px++) {
      var x = (px + 0.5) / k - 0.5, sw = 0, sv = 0;
      for (var ri = Math.floor(y) - R; ri <= Math.ceil(y) + R; ri++) {
        if (ri < 0 || ri >= G.rows) continue;
        for (var ci = Math.floor(x) - R; ci <= Math.ceil(x) + R; ci++) {
          if (ci < 0 || ci >= G.cols) continue;
          var v = V[ri * G.cols + ci];
          if (isNaN(v)) continue;
          var dx = ci - x, dy = ri - y, w = Math.exp(-(dx * dx + dy * dy) / sig2);
          sw += w; sv += w * v;
        }
      }
      if (sw < 0.05) continue;
      var t = (sv / sw - thr) / (top - thr);
      if (t <= 0) continue;
      var col = rampRgb(HOT_RAMP, t), cov = clamp(sw / 1.5, 0, 1), a = clamp(t * 3, 0, 1) * (0.62 + 0.33 * t) * cov, i = (py * Wp + px) * 4;
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = Math.round(a * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv.toDataURL();
}

  },
  getCells: function () {
    return heatFeatures.map(function (f) {
      var ring = f.geometry.coordinates[0], lons = ring.map(function (c) { return c[0]; }), lats = ring.map(function (c) { return c[1]; });

    if (heat.style === 'smooth') {
      return '<h2>Heat hotspots</h2><div class="grad" style="background:linear-gradient(to right, rgba(40,175,80,.35), rgb(200,215,40) 22%, rgb(245,150,25) 45%, rgb(230,60,35) 72%, rgb(180,10,35))"></div>' +
        '<div class="ticks"><span style="left:0">+' + heat.threshold + '</span><span style="left:100%">+' + heatDomain[1] + ' °F</span></div>' +

    '<dt>Surveyed bus stops</dt><dd>' + S.stops + (S.stops ? ' (' + S.poor + ' poor)' : '') + '</dd>' +
    '<dt>Needs attention</dt><dd>' + S.flagged + '</dd>' +
    '<dt>Riders a month</dt><dd>' + fmt(S.riders) + '</dd>' +
    (S.maxDt !== null ? '<dt>Hottest cell</dt><dd>' + (S.maxDt > 0 ? '+' : '') + S.maxDt + ' °F</dd>' : '') +
    '<dt>Working lights' + (lighting.sample ? ' *' : '') + '</dt><dd>' + S.working + ' (' + S.solar + ' solar)</dd>' +
    '</dl>';
  h += '<div class="ac-foot">' + (area.pts
    ? '<button type="button" class="linkbtn" id="ac-clear">Clear custom area</button>'
    : 'Draw an area to see its numbers.') + (lighting.sample ? ' * Sample lighting data.' : '') + '</div>';
  document.getElementById('ac-body').innerHTML = h;
  var cl = document.getElementById('ac-clear'); if (cl) cl.addEventListener('click', clearArea);
}
function dataChanged(d) { renderLayersTab(); if (d === activeSurface) renderLegend(); updateCard(); }
document.getElementById('ac-toggle').addEventListener('click', function () { setCardOpen(document.getElementById('areacard').classList.contains('collapsed')); });
function setCardOpen(open) {
  document.getElementById('areacard').classList.toggle('collapsed', !open);
  document.getElementById('ac-toggle').setAttribute('aria-expanded', String(open));
}

/* =====================================================================
   Drawing a custom area: click to add corners, click the first corner,
   double-click or press Enter to finish, Esc to cancel.
   ===================================================================== */
var areaRenderer = L.svg({ pane: 'area' }), drawRenderer = L.svg({ pane: 'drawPane' });
var draw = { active: false, pts: [], line: null, guide: null, dots: null };
var toastEl = document.getElementById('toast');
function toast(msg) { toastEl.textContent = msg; toastEl.hidden = !msg; }
function ensurePattern() {
  var svg = areaRenderer._container;
  if (!svg || svg.querySelector('#area-check')) return;
  var ns = 'http://www.w3.org/2000/svg', defs = document.createElementNS(ns, 'defs'), p = document.createElementNS(ns, 'pattern');
  p.setAttribute('id', 'area-check'); p.setAttribute('width', '14'); p.setAttribute('height', '14'); p.setAttribute('patternUnits', 'userSpaceOnUse');
  [[0, 0, '#ffffff', 0.42], [7, 7, '#ffffff', 0.42], [7, 0, '#8d969b', 0.22], [0, 7, '#8d969b', 0.22]].forEach(function (r) {
    var e = document.createElementNS(ns, 'rect');
    e.setAttribute('x', r[0]); e.setAttribute('y', r[1]); e.setAttribute('width', '7'); e.setAttribute('height', '7');
    e.setAttribute('fill', r[2]); e.setAttribute('fill-opacity', r[3]); p.appendChild(e);
  });
  defs.appendChild(p); svg.insertBefore(defs, svg.firstChild);
}
function setDrawUi() {
  var btn = document.getElementById('draw-btn');
  document.getElementById('draw-label').textContent = draw.active ? 'Finish Area' : 'Draw Custom Area';
  btn.disabled = draw.active && draw.pts.length < 3;
  document.getElementById('draw-cancel').hidden = !draw.active;
}
function startDraw() {
  map.closePopup();
  draw.active = true; draw.pts = [];
  map.getContainer().classList.add('drawing');
  map.doubleClickZoom.disable();
  var st = { renderer: drawRenderer, pane: 'drawPane', color: '#ffffff', weight: 2, interactive: false };
  draw.line = L.polyline([], st).addTo(map);
  draw.guide = L.polyline([], L.extend({}, st, { dashArray: '5 6', opacity: 0.8 })).addTo(map);
  draw.dots = L.layerGroup().addTo(map);
  toast('Click the map to add corners. Click the first corner or press Enter to finish. Esc cancels.');
  setDrawUi();
}
function endDraw() {
  draw.active = false;
  [draw.line, draw.guide, draw.dots].forEach(function (l) { if (l) map.removeLayer(l); });
  draw.line = draw.guide = draw.dots = null;
  map.getContainer().classList.remove('drawing');
  map.doubleClickZoom.enable();
  toast(''); setDrawUi();
}
function finishDraw() {
  if (draw.pts.length < 3) { toast('Add at least three corners, then finish.'); return; }
  var pts = draw.pts.map(function (ll) { return [ll.lat, ll.lng]; });
  endDraw();
  if (area.layer) map.removeLayer(area.layer);
  area.pts = pts;
  area.layer = L.polygon(pts, { renderer: areaRenderer, pane: 'area', color: '#ffffff', weight: 1.5, opacity: 0.9, fillColor: 'url(#area-check)', fillOpacity: 1, interactive: false }).addTo(map);
  ensurePattern();
  setCardOpen(true); updateCard();
}
function clearArea() {
  if (area.layer) map.removeLayer(area.layer);
  area.layer = null; area.pts = null; updateCard();
}
map.on('click', function (e) {
  if (!draw.active) return;
  var p = map.latLngToContainerPoint(e.latlng);
  if (draw.pts.length >= 3 && p.distanceTo(map.latLngToContainerPoint(draw.pts[0])) < 14) { finishDraw(); return; }
  var last = draw.pts[draw.pts.length - 1];
  if (last && p.distanceTo(map.latLngToContainerPoint(last)) < 5) return;
  draw.pts.push(e.latlng);
  draw.line.setLatLngs(draw.pts);
  draw.dots.addLayer(L.circleMarker(e.latlng, { renderer: drawRenderer, pane: 'drawPane', radius: draw.pts.length === 1 ? 6 : 4, color: '#ff5a1f', weight: 2, fillColor: '#ffffff', fillOpacity: 1, interactive: false }));
  setDrawUi();
});
map.on('mousemove', function (e) {
  if (!draw.active || !draw.pts.length) return;
  var last = draw.pts[draw.pts.length - 1];
  draw.guide.setLatLngs(draw.pts.length >= 2 ? [last, e.latlng, draw.pts[0]] : [last, e.latlng]);
});
map.on('dblclick', function () { if (draw.active) finishDraw(); });
document.addEventListener('keydown', function (e) {
  if (!draw.active) return;
  if (e.key === 'Escape') endDraw();
  else if (e.key === 'Enter' && document.activeElement === document.body) finishDraw();
});
document.getElementById('draw-btn').addEventListener('click', function () { if (draw.active) finishDraw(); else startDraw(); });
document.getElementById('draw-cancel').addEventListener('click', endDraw);

/* =====================================================================
   Search: stops by name, street, route, stop ID or LAVTA number
   ===================================================================== */
var searchIndex = [];
DATA.busStops.forEach(function (s, i) {
  searchIndex.push({ name: s[0], sub: 'Bus stop, rated ' + s[3], key: (s[0] + ' ' + s[6].join(' ') + ' ' + s[5].join(' ')).toLowerCase(), lat: s[1], lon: s[2], ctx: { busIdx: i } });
});
ridStops.forEach(function (r) {
  if (ridToQuality[r[0]] !== undefined) return;   // already listed as a surveyed stop
  searchIndex.push({ name: r[1], sub: 'LAVTA stop #' + r[0] + ', ' + ridTiers[r[8]].short, key: (r[1] + ' ' + r[0]).toLowerCase(), lat: r[2], lon: r[3], ctx: { sn: r[0] } });
});
var sInput = document.getElementById('search'), sList = document.getElementById('search-results'), sHits = [], sActive = -1;
function renderSearch() {
  var q = sInput.value.trim().toLowerCase();
  if (q.length < 2) { sList.hidden = true; sInput.setAttribute('aria-expanded', 'false'); return; }
  var terms = q.split(/\s+/);
  sHits = searchIndex.filter(function (e) { return terms.every(function (t) { return e.key.indexOf(t) >= 0; }); })
    .map(function (e) {
      var n = e.name.toLowerCase();
      return { e: e, score: (n.indexOf(q) === 0 ? 4 : 0) + (n.indexOf(q) >= 0 ? 2 : 0) + (terms.every(function (t) { return n.indexOf(t) >= 0; }) ? 1 : 0) };
    })
    .sort(function (a, b) { return b.score - a.score; }).map(function (x) { return x.e; }).slice(0, 8);
  sActive = sHits.length ? 0 : -1;
  sList.innerHTML = sHits.length ? sHits.map(function (e, i) {
    return '<li role="option" id="sr-' + i + '" data-i="' + i + '" aria-selected="' + (i === sActive) + '"><div class="sr-name">' + esc(e.name) + '</div><div class="sr-sub">' + esc(e.sub) + '</div></li>';
  }).join('') : '<li class="sr-empty" role="option" aria-disabled="true">No stops match “' + esc(sInput.value.trim()) + '”</li>';
  sList.hidden = false; sInput.setAttribute('aria-expanded', 'true');
  sInput.setAttribute('aria-activedescendant', sActive >= 0 ? 'sr-0' : '');
}
function moveSearch(d) {
  if (!sHits.length) return;
  sActive = (sActive + d + sHits.length) % sHits.length;
  sList.querySelectorAll('li[data-i]').forEach(function (li) { li.setAttribute('aria-selected', String(+li.dataset.i === sActive)); });
  sInput.setAttribute('aria-activedescendant', 'sr-' + sActive);
}
function pickSearch(e) {
  sInput.value = e.name; sList.hidden = true; sInput.setAttribute('aria-expanded', 'false');
  var ctx = L.extend({ lat: e.lat, lon: e.lon }, e.ctx);
  var open = function () { L.popup({ maxWidth: 300, minWidth: 230 }).setLatLng([e.lat, e.lon]).setContent(stopPopup(ctx)).openOn(map); };
  map.flyTo([e.lat, e.lon], Math.max(map.getZoom(), 17), { duration: 0.8 });
  map.once('moveend', open);
  if (ctx.sn != null) todSelect(ctx.sn); else { var sn = ridLinkFor(ctx.busIdx); if (sn !== null) todSelect(sn); }
}
sInput.addEventListener('input', renderSearch);
sInput.addEventListener('focus', renderSearch);
sInput.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSearch(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearch(-1); }
  else if (e.key === 'Enter' && sActive >= 0) { e.preventDefault(); pickSearch(sHits[sActive]); }
  else if (e.key === 'Escape') { sList.hidden = true; sInput.setAttribute('aria-expanded', 'false'); }
});
sInput.addEventListener('blur', function () { setTimeout(function () { sList.hidden = true; sInput.setAttribute('aria-expanded', 'false'); }, 150); });
sList.addEventListener('mousedown', function (e) {
  var li = e.target.closest('li[data-i]'); if (!li) return;
  e.preventDefault(); pickSearch(sHits[+li.dataset.i]);
});

/* =====================================================================
   Drawer, tabs, zoom and popup wiring
   ===================================================================== */
function setDrawer(open) {
  document.body.classList.toggle('drawer-open', open);
  document.getElementById('drawer-toggle').setAttribute('aria-expanded', String(open));
}
function showTab(name) {
  var tod = name === 'tod';
  document.getElementById('tab-layers').hidden = tod;
  document.getElementById('tab-tod').hidden = !tod;
  document.getElementById('tab-btn-layers').setAttribute('aria-selected', String(!tod));
  document.getElementById('tab-btn-tod').setAttribute('aria-selected', String(tod));
  document.documentElement.style.setProperty('--dw', tod ? '480px' : '336px');
  setDrawer(true);
  if (tod) todRender();
}
document.getElementById('drawer-toggle').addEventListener('click', function () { setDrawer(!document.body.classList.contains('drawer-open')); });
document.getElementById('drawer-close').addEventListener('click', function () { setDrawer(false); });
document.getElementById('tab-btn-layers').addEventListener('click', function () { showTab('layers'); });
document.getElementById('tab-btn-tod').addEventListener('click', function () { showTab('tod'); });

map.on('zoomend', function () { var z = map.getZoom(); LAYERS.forEach(function (d) { if (d.onZoom) d.onZoom(z); }); });
map.on('popupopen', function (e) {
  if (draw.active) { map.closePopup(); return; }
  var el = e.popup.getElement(); if (!el) return;
  el.querySelectorAll('.bp-tod').forEach(function (b) {
    b.addEventListener('click', function () { todSel = parseInt(b.dataset.stop, 10); showTab('tod'); });
  });
});

/* =====================================================================
   Start up
   ===================================================================== */
pollen.sampleData = pollenFromRows(SAMPLES.pollen, true);
lighting.sampleData = { name: SAMPLES.lighting.name, sample: true, items: SAMPLES.lighting.rows.map(function (r) { return { id: r[0], lat: r[1], lon: r[2], type: r[3], status: r[4] }; }) };
heat.build();
pollen.setData(pollen.sampleData);
lighting.setData(lighting.sampleData);
busLayer.build(); ridLayer.build();
attention.build(); attention.ready = true;
LAYERS.forEach(function (d) { if (d.kind === 'points' && d.on) d.group.addTo(map); });
setSurface(heat);
updateCard();
var phone = window.matchMedia('(max-width: 720px)').matches;
if (phone) setCardOpen(false);
setDrawer(!phone && window.innerWidth >= 1200);

todData = todFromEmbedded(DATA.todEmbedded);
(function () {
  var info = todStatusText(todData, DATA.todEmbedded.name, 'Showing'), st = document.getElementById('tod-status');
  st.style.color = info.good ? 'var(--muted)' : 'var(--warn)'; st.textContent = info.text;
})();
</script>
</body>
